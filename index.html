<script>
/* ==================================================================
   YouTube IFrame API bootstrap
   ================================================================== */
let ytApiReady = false;
let ytApiReadyCallbacks = [];
function onYouTubeIframeAPIReady(){
  ytApiReady = true;
  ytApiReadyCallbacks.forEach(cb => cb());
  ytApiReadyCallbacks = [];
}
function whenYT(cb){ ytApiReady ? cb() : ytApiReadyCallbacks.push(cb); }

(function loadYT(){
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
})();

/* ==================================================================
   Deterministic per-day / per-slot shuffle
   ================================================================== */
function hashString(str){
  let hash = 0;
  for (let i = 0; i < str.length; i++){
    hash = (hash << 5) - hash + str.charCodeAt(i);
    hash |= 0;
  }
  return hash;
}
function mulberry32(seed){
  let a = seed;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seedStr){
  const rand = mulberry32(hashString(seedStr));
  const out = arr.slice();
  for (let i = out.length - 1; i > 0; i--){
    const j = Math.floor(rand() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}
function todayKey(){
  const d = new Date();
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}

/* ==================================================================
   Click sound effect (synthesized — no audio files needed)
   ================================================================== */
let audioCtx = null;
function getAudioCtx(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playClickSound(){
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;

    // low mechanical thunk
    const osc = ctx.createOscillator();
    const oscGain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(60, now + 0.06);
    oscGain.gain.setValueAtTime(0.25, now);
    oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
    osc.connect(oscGain).connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.09);

    // short high-frequency click transient
    const bufferSize = Math.floor(ctx.sampleRate * 0.03);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.18, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
    const filter = ctx.createBiquadFilter();
    filter.type = 'highpass'; filter.frequency.value = 2000;
    noise.connect(filter).connect(noiseGain).connect(ctx.destination);
    noise.start(now);
  } catch(e){ /* audio unavailable — fail silently */ }
}

/* ==================================================================
   Duration cache + probing (YouTube videos)
   ================================================================== */
const memDurationCache = {};
function getCachedDuration(id){
  if (memDurationCache[id] != null) return memDurationCache[id];
  try {
    const v = localStorage.getItem('signal_dur_' + id);
    return v ? parseInt(v, 10) : null;
  } catch(e){ return null; }
}
function setCachedDuration(id, seconds){
  memDurationCache[id] = seconds;
  try { localStorage.setItem('signal_dur_' + id, String(seconds)); } catch(e){}
}

// Probes a single video's duration using a dedicated hidden player slot.
// Resolves immediately from cache when possible; otherwise spins up a
// throwaway YT.Player just long enough to read getDuration().
function probeDurationInSlot(videoId, slotId){
  return new Promise((resolve) => {
    const cached = getCachedDuration(videoId);
    if (cached) { resolve(cached); return; }
    let player = null;
    player = new YT.Player(slotId, {
      height: '1', width: '1', videoId: videoId,
      playerVars: { autoplay: 0, controls: 0 },
      events: {
        onReady: (e) => {
          const dur = Math.floor(e.target.getDuration()) || 0;
          const val = dur > 0 ? dur : 180;
          setCachedDuration(videoId, val);
          try { e.target.destroy(); } catch(err){}
          resolve(val);
        },
        onError: () => {
          setCachedDuration(videoId, 180);
          try { player.destroy(); } catch(err){}
          resolve(180);
        }
      }
    });
  });
}

// How many videos to probe at once. Higher = faster "analyzing" step,
// but too high can start to strain slower connections/devices.
const PROBE_CONCURRENCY = 6;

async function ensureDurations(channel, onProgress){
  const map = {};
  const videos = channel.videos;
  const total = videos.length;
  let nextIndex = 0;
  let doneCount = 0;

  const poolContainer = document.getElementById('probe-pool');
  const slotIds = [];
  const slotCount = Math.max(1, Math.min(PROBE_CONCURRENCY, total));
  const poolTag = Date.now();
  for (let s = 0; s < slotCount; s++){
    const div = document.createElement('div');
    div.id = 'probe-slot-' + poolTag + '-' + s;
    poolContainer.appendChild(div);
    slotIds.push(div.id);
  }

  async function worker(slotId){
    while (nextIndex < videos.length){
      const i = nextIndex++;
      const v = videos[i];
      map[v.id] = await probeDurationInSlot(v.id, slotId);
      doneCount++;
      if (onProgress) onProgress(doneCount, total);
    }
  }

  await Promise.all(slotIds.map(worker));

  slotIds.forEach(id => {
    const el = document.getElementById(id);
    if (el && el.parentNode) el.parentNode.removeChild(el);
  });

  return map;
}

/* ==================================================================
   Ad clips (local .mp4 files)
   ================================================================== */
let adClips = []; // { name, file, duration }

function probeLocalDuration(file){
  return new Promise((resolve) => {
    const v = document.createElement('video');
    v.preload = 'metadata';
    v.muted = true;
    v.onloadedmetadata = () => {
      const d = isFinite(v.duration) && v.duration > 0 ? v.duration : 15;
      URL.revokeObjectURL(v.src);
      resolve(d);
    };
    v.onerror = () => resolve(15);
    v.src = URL.createObjectURL(file);
  });
}

/* Picks a deterministic (per-seed) sequence of ad clips whose total
   duration reaches roughly targetSeconds. */
function pickAdBreak(clips, seedStr, targetSeconds){
  if (!clips || clips.length === 0) return [];
  const picks = [];
  let total = 0;
  let round = 0;
  const maxClips = 12;
  while (total < targetSeconds && picks.length < maxClips && round < 20){
    const shuffled = seededShuffle(clips, seedStr + '|r' + round);
    for (const clip of shuffled){
      picks.push(clip);
      total += clip.duration || 15;
      if (total >= targetSeconds || picks.length >= maxClips) break;
    }
    round++;
  }
  return picks;
}

/* ==================================================================
   Schedule — a flat list of items (videos + ad-break clips) with
   known durations, walked using real elapsed time in the day.
   ================================================================== */
/* Builds a long, repeat-avoiding play order for a channel using a
   deterministic "cooldown" scheduler: at each slot, only videos that
   haven't played within the last `minGap` slots are eligible, and one
   is picked via a seeded RNG (same order for everyone on a given day —
   not true randomness, and reproducible for the schedule viewer). This
   guarantees a real minimum spacing between repeats of the same video,
   not just "not literally back-to-back". Covers roughly a full day. */
function buildVideoOrder(channel, durationsById){
  const videos = channel.videos;
  if (videos.length <= 1) return videos.slice();
  const seedBase = todayKey() + '|' + channel.id;
  const rand = mulberry32(hashString(seedBase));
  const avgDuration = videos.reduce((sum, v) => sum + (durationsById[v.id] || 180), 0) / videos.length;
  const targetSeconds = 24 * 3600;
  const totalSlots = Math.min(400, Math.max(videos.length, Math.ceil(targetSeconds / Math.max(1, avgDuration))));
  const minGap = Math.max(1, Math.min(videos.length - 1, Math.floor(videos.length / 2)));

  const lastUsedAt = new Map(); // video.id -> slot index it last played
  const order = [];
  for (let slot = 0; slot < totalSlots; slot++){
    let candidates = videos.filter(v => (slot - (lastUsedAt.has(v.id) ? lastUsedAt.get(v.id) : -Infinity)) > minGap);
    if (candidates.length === 0){
      // Everything is still "on cooldown" (can happen right at the start,
      // or with a tiny library) — fall back to whichever video(s) have
      // gone longest without playing.
      let maxAge = -Infinity;
      videos.forEach(v => {
        maxAge = Math.max(maxAge, slot - (lastUsedAt.has(v.id) ? lastUsedAt.get(v.id) : -Infinity));
      });
      candidates = videos.filter(v => (slot - (lastUsedAt.has(v.id) ? lastUsedAt.get(v.id) : -Infinity)) === maxAge);
    }
    const pick = candidates[Math.floor(rand() * candidates.length)];
    order.push(pick);
    lastUsedAt.set(pick.id, slot);
  }
  return order;
}

function buildSchedule(channel, durationsById, clips){
  const order = buildVideoOrder(channel, durationsById);
  const items = [];
  order.forEach((v, i) => {
    items.push({ type: 'video', video: v, duration: durationsById[v.id] || 180 });
    const isBreakSlot = (i % AD_BREAK_FREQUENCY) === (AD_BREAK_FREQUENCY - 1);
    if (AD_BREAKS_ENABLED && isBreakSlot && clips && clips.length > 0){
      const breakSeed = todayKey() + '|' + channel.id + '|break' + i;
      const breakClips = pickAdBreak(clips, breakSeed, AD_BREAK_SECONDS);
      breakClips.forEach((c, ci) => {
        items.push({ type: 'ad', clip: c, duration: c.duration || 15, breakIndex: i, clipIndex: ci, breakTotal: breakClips.length });
      });
    }
  });
  const durations = items.map(it => it.duration);
  const total = durations.reduce((a, b) => a + b, 0);
  return { items, durations, total };
}

function getNowPlaying(schedule){
  const now = new Date();
  const secs = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds() + now.getMilliseconds() / 1000;
  const elapsed = schedule.total > 0 ? (secs % schedule.total) : 0;
  let acc = 0;
  for (let i = 0; i < schedule.items.length; i++){
    const d = schedule.durations[i];
    if (elapsed < acc + d){
      return {
        index: i, item: schedule.items[i], offset: elapsed - acc, duration: d,
        nextItem: schedule.items[(i + 1) % schedule.items.length]
      };
    }
    acc += d;
  }
  const li = schedule.items.length - 1;
  return { index: li, item: schedule.items[li], offset: 0, duration: schedule.durations[li] || 0, nextItem: schedule.items[0] };
}
function itemTitle(item){
  if (!item) return '—';
  if (item.type === 'ad') return 'Commercial: ' + item.clip.name.replace(/\.[^.]+$/, '');
  return item.video.title;
}
function fmtTime(s){
  s = Math.max(0, Math.floor(s));
  const m = Math.floor(s / 60), sec = s % 60;
  return m + ":" + String(sec).padStart(2, '0');
}
function fmtClock(totalSeconds){
  const h = Math.floor(totalSeconds / 3600) % 24;
  const m = Math.floor((totalSeconds % 3600) / 60);
  const period = h >= 12 ? 'PM' : 'AM';
  let h12 = h % 12; if (h12 === 0) h12 = 12;
  return h12 + ':' + String(m).padStart(2, '0') + ' ' + period;
}
function fmtDurationShort(s){
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  if (h > 0) return h + 'h ' + m + 'm';
  if (m > 0) return m + 'm';
  return s + 's';
}

/* Flattens a schedule into a list of {start, dur, title, type, isNow}
   entries (times in raw seconds-of-day). Item 0 is treated as starting
   at 00:00:00 (matching getNowPlaying's `secs % total` logic), and the
   list covers one full loop of the schedule (or 24h, whichever is
   shorter). Consecutive ad clips from the same break are grouped into
   a single "Commercial Break" entry so the guide stays readable. */
function buildScheduleView(schedule){
  const rows = [];
  if (!schedule || schedule.items.length === 0) return rows;
  const now = new Date();
  const nowSecs = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
  const nowElapsed = schedule.total > 0 ? (nowSecs % schedule.total) : 0;
  const cap = Math.min(schedule.total, 24 * 3600);
  let acc = 0, i = 0;
  while (i < schedule.items.length && acc < cap){
    const item = schedule.items[i];
    const startAcc = acc;
    if (item.type === 'ad'){
      let breakDur = 0;
      const breakIdx = item.breakIndex;
      while (i < schedule.items.length && schedule.items[i].type === 'ad' && schedule.items[i].breakIndex === breakIdx){
        breakDur += schedule.durations[i];
        acc += schedule.durations[i];
        i++;
      }
      const isNow = nowElapsed >= startAcc && nowElapsed < startAcc + breakDur;
      rows.push({ start: startAcc, dur: breakDur, title: 'Commercial Break', type: 'ad', isNow });
    } else {
      const d = schedule.durations[i];
      const isNow = nowElapsed >= startAcc && nowElapsed < startAcc + d;
      rows.push({ start: startAcc, dur: d, title: item.video.title, type: 'video', isNow });
      acc += d;
      i++;
    }
  }
  return rows;
}

   in, otherwise a schedule built from whatever durations are already

function getOrBuildScheduleForGuide(ch){
  if (currentSchedule && currentChannelIndex !== null && CHANNELS[currentChannelIndex].id === ch.id){
    return currentSchedule;
  }
  const durationsById = {};
  ch.videos.forEach(v => { durationsById[v.id] = getCachedDuration(v.id) || 180; });
  return buildSchedule(ch, durationsById, adClips);
}

function renderGuide(){
  const now = new Date();
  const nowSecs = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
  const nowLeft = secToPx(nowSecs);

  let ticksHtml = '';
  for (let h = 0; h < 24; h++){
    ticksHtml += `<div class="guide-tick" style="left:${secToPx(h * 3600)}px;">${fmtHourLabel(h)}</div>`;
  }

  let rowsHtml = '';
  CHANNELS.forEach((ch, idx) => {
    const activeCls = idx === currentChannelIndex ? 'active' : '';
    const labelHtml = `
      <div class="guide-row-label ${activeCls}" data-ch="${idx}">
        <div class="guide-ch-dot" style="background:${ch.color}"></div>

    if (!ch.videos || ch.videos.length === 0){
      rowsHtml += `
        <div class="guide-row">
          ${labelHtml}
          <div class="guide-track" style="width:${GUIDE_TRACK_WIDTH}px;">
            <div class="guide-empty" style="padding:0 12px; text-align:left; display:flex; align-items:center; height:100%;">No videos yet</div>
          </div>
        </div>`;
      return;
    }
    const rows = buildScheduleView(getOrBuildScheduleForGuide(ch));
    const blocksHtml = rows.map(r => {
      const left = secToPx(r.start);
      const width = Math.max(30, secToPx(r.dur) - 2);
      const cls = (r.type === 'ad' ? 'ad ' : '') + (r.isNow ? 'now' : '');
      return `
        <div class="guide-block ${cls}" style="left:${left}px; width:${width}px;" data-ch="${idx}" title="${escapeHtml(r.title)}">
          <div class="guide-block-title">${escapeHtml(r.title)}</div>
          <div class="guide-block-time">${fmtClock(r.start)} · ${fmtDurationShort(r.dur)}</div>
        </div>`;
    }).join('');
    rowsHtml += `
      <div class="guide-row">
        ${labelHtml}
        <div class="guide-track" style="width:${GUIDE_TRACK_WIDTH}px;">${blocksHtml}</div>
      </div>`;
  });

  guideContent.innerHTML = `
    <div class="guide-inner" style="position:relative; width:${GUIDE_LABEL_WIDTH + GUIDE_TRACK_WIDTH}px;">
      <div class="guide-head-row">
        <div class="guide-corner"></div>
        <div class="guide-timeline" style="width:${GUIDE_TRACK_WIDTH}px;">${ticksHtml}</div>
      </div>
      ${rowsHtml}
      <div class="guide-now-line" style="left:${GUIDE_LABEL_WIDTH + nowLeft}px;"></div>
    </div>
  `;
  return nowLeft;
}

function sleep(ms){ return new Promise((resolve) => setTimeout(resolve, ms)); }

/* ---- animated TV static (canvas noise), rendered small and scaled up
   via CSS for a chunky retro look and cheap performance ---- */
const staticCanvas = document.getElementById('static-canvas');
const staticCtx = staticCanvas.getContext('2d');
let staticRAF = null;
const STATIC_SCALE = 6;

function resizeStaticCanvas(){
  const w = Math.max(1, Math.floor(screenWrap.clientWidth / STATIC_SCALE));
  const h = Math.max(1, Math.floor(screenWrap.clientHeight / STATIC_SCALE));
  if (staticCanvas.width !== w) staticCanvas.width = w;
  if (staticCanvas.height !== h) staticCanvas.height = h;
}
function drawStaticFrame(){
  resizeStaticCanvas();
  const w = staticCanvas.width, h = staticCanvas.height;
  const imgData = staticCtx.createImageData(w, h);
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4){
    const v = (Math.random() * 255) | 0;
    data[i] = v; data[i + 1] = v; data[i + 2] = v; data[i + 3] = 255;
  }
  staticCtx.putImageData(imgData, 0, 0);
  staticRAF = requestAnimationFrame(drawStaticFrame);
}
function startStatic(){
  staticBg.style.display = 'block';
  if (!staticRAF) drawStaticFrame();
}
function stopStatic(){
  staticBg.style.display = 'none';
  if (staticRAF){ cancelAnimationFrame(staticRAF); staticRAF = null; }
}

function showStatus(big, sub, progress){

let tuneGeneration = 0;

async function tuneChannel(idx){
  const ch = CHANNELS[idx];
  const myGen = ++tuneGeneration;
  if (!ch.videos || ch.videos.length === 0){
    currentSchedule = null;
    showStatus('NO SIGNAL', 'This channel has no videos yet — add some in the code.', 0);
    return;
  }

  // Quick burst of pure static on the channel change, like retuning an
  // old TV, before settling into the channel name + progress bar.
  showStatus('', '', 0);
  statusMsg.classList.add('burst');
  await sleep(450);
  if (myGen !== tuneGeneration) return;
  statusMsg.classList.remove('burst');
  showStatus('CH ' + ch.number, ch.name, 5);

  whenYT(async () => {
    const durationsById = await ensureDurations(ch, (done, totalCount) => {
      if (myGen !== tuneGeneration) return;
      showStatus('CH ' + ch.number, ch.name + ' — analyzing ' + done + '/' + totalCount, 5 + (done / totalCount) * 55);
    });
    if (idx !== currentChannelIndex || myGen !== tuneGeneration) return; // user switched away while loading
    currentSchedule = buildSchedule(ch, durationsById, adClips);
    const np = getNowPlaying(currentSchedule);
    updateEPG(np);

    // Keep the "tuning in" overlay up through the actual video/ad load —
    // hiding it only once playback has genuinely started avoids a gap
    // where the raw player is visible (black frame / captions only)
    // before pixels actually show up.
    showStatus('CH ' + ch.number, ch.name + ' — loading video…', 90);
    let settled = false;
    const reveal = () => {
      if (settled || myGen !== tuneGeneration) return;
      settled = true;
      hideStatus();
    };
    showItem(np, reveal);
    // Safety net: never leave the overlay stuck up if a playback event
    // doesn't fire for some reason (slow network, blocked embed, etc.)
    setTimeout(reveal, 8000);
  });
}

function itemKey(item){
  if (!item) return null;
  return item.type === 'ad'
    ? ('ad:' + item.clip.name + ':' + item.breakIndex + ':' + item.clipIndex)
    : ('video:' + item.video.id);
}

function loadIntoYouTube(np, onPlaying){
  whenYT(() => {
    const vid = np.item.video.id;
    if (!mainPlayer){
      if (onPlaying) firstPlayCallback = onPlaying;
      mainPlayer = new YT.Player('main-player', {
        height: '100%', width: '100%', videoId: vid,
        playerVars: { autoplay: 1, controls: 1, rel: 0, modestbranding: 1 },
        events: {
          onReady: (e) => {
            mainPlayerReady = true;
            e.target.seekTo(np.offset, true);
            e.target.playVideo();
          },
          onStateChange: (e) => {
            if (e.data === 1 /* YT.PlayerState.PLAYING */ && firstPlayCallback){
              const cb = firstPlayCallback;
              firstPlayCallback = null;
              cb();
            }
          },
          onError: () => { /* bad video id — schedule will move on next tick */ }
        }
      });
      mainPlayer._loadedId = vid;
    } else if (mainPlayer._loadedId !== vid){
      if (onPlaying) firstPlayCallback = onPlaying;
      mainPlayer.loadVideoById(vid, np.offset);
      mainPlayer._loadedId = vid;
    } else if (mainPlayerReady && typeof mainPlayer.getPlayerState === 'function'){
      const state = mainPlayer.getPlayerState();
      if (state !== 1 /* YT.PlayerState.PLAYING */){
        if (onPlaying) firstPlayCallback = onPlaying;
        mainPlayer.seekTo(np.offset, true);
        mainPlayer.playVideo();
      } else if (onPlaying){
        // Already playing this exact video — nothing to wait for.
        onPlaying();
      }
    } else if (onPlaying){
      onPlaying();
    }
  });
}

function showItem(np, onPlaying){
  if (np.item.type === 'video'){
    adPlayerEl.pause();
    adPlayerEl.style.display = 'none';
    mainPlayerEl.style.display = 'block';
    loadIntoYouTube(np, onPlaying);
  } else {
    mainPlayerEl.style.display = 'none';
    try { if (mainPlayer && mainPlayer.pauseVideo) mainPlayer.pauseVideo(); } catch(e){}
    adPlayerEl.style.display = 'block';
    const key = itemKey(np.item);
    if (loadedAdKey !== key){
      if (currentAdObjectUrl) URL.revokeObjectURL(currentAdObjectUrl);
      currentAdObjectUrl = URL.createObjectURL(np.item.clip.file);
      adPlayerEl.src = currentAdObjectUrl;
      loadedAdKey = key;
      adPlayerEl.currentTime = 0;
      if (onPlaying) adPlayerEl.addEventListener('playing', onPlaying, { once: true });
      adPlayerEl.play().catch(() => {});
    } else if (Math.abs(adPlayerEl.currentTime - np.offset) > 2){
      adPlayerEl.currentTime = np.offset;
      if (onPlaying) onPlaying();
    } else if (onPlaying){
      onPlaying();
    }
    if (adPlayerEl.paused) adPlayerEl.play().catch(() => {});
  }
}

function updateEPG(np){
  const isAd = np.item.type === 'ad';
  epgEl.classList.toggle('on-ad', isAd);
  epgNowLabel.textContent = isAd ? 'Ad Break' : 'Now';
  epgNowTitle.textContent = itemTitle(np.item);
  epgNowBar.style.width = np.duration > 0 ? ((np.offset / np.duration) * 100) + '%' : '0%';
  epgNowTime.textContent = fmtTime(np.offset) + ' / ' + fmtTime(np.duration);
  epgNextTitle.textContent = np.nextItem
    ? (np.nextItem.type === 'ad' ? 'Commercial Break' : np.nextItem.video.title)
    : '—';
}

/* Main sync loop: recomputes what should be on air every second and
   corrects for drift, swapping between YouTube video and local ad clip
   as needed. */
setInterval(() => {
  if (!currentSchedule) return;
  const np = getNowPlaying(currentSchedule);
  updateEPG(np);
  showItem(np);
  if (np.item.type === 'video' && mainPlayer && mainPlayerReady && mainPlayer._loadedId === np.item.video.id
      && typeof mainPlayer.getCurrentTime === 'function'){
    const cur = mainPlayer.getCurrentTime();
    if (Math.abs(cur - np.offset) > 4) mainPlayer.seekTo(np.offset, true);
  }
}, 1000);

/* Clock */
setInterval(() => {
  const now = new Date();
  clockEl.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  datelineEl.textContent = now.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
}, 1000);

/* Keyboard remote: up/down arrows change channel */
window.addEventListener('keydown', (e) => {
  if (CHANNELS.length === 0) return;
  if (e.key === 'ArrowUp'){
    const next = currentChannelIndex === null ? 0 : (currentChannelIndex - 1 + CHANNELS.length) % CHANNELS.length;
    selectChannel(next);
  } else if (e.key === 'ArrowDown'){
    const next = currentChannelIndex === null ? 0 : (currentChannelIndex + 1) % CHANNELS.length;
    selectChannel(next);
  }
});

/* Accept either a bare 11-character video ID or a full YouTube URL
   (youtu.be/…, watch?v=…, embed/…, shorts/…) in CHANNELS so you don't
   have to hand-trim links. */
function extractYouTubeId(input){
  if (!input) return input;
  const trimmed = String(input).trim();
  if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;
  const patterns = [
    /youtu\.be\/([a-zA-Z0-9_-]{11})/,
    /[?&]v=([a-zA-Z0-9_-]{11})/,
    /embed\/([a-zA-Z0-9_-]{11})/,
    /shorts\/([a-zA-Z0-9_-]{11})/
  ];
  for (const re of patterns){
    const m = trimmed.match(re);
    if (m) return m[1];
  }
  return trimmed; // not recognized — leave as-is, will just fail to load
}
CHANNELS.forEach(ch => (ch.videos || []).forEach(v => { v.id = extractYouTubeId(v.id); }));

/* Boot */
renderRail();
let startIdx = 0;
try {
  const saved = parseInt(localStorage.getItem('signal_last_channel'), 10);
  if (!isNaN(saved) && saved >= 0 && saved < CHANNELS.length) startIdx = saved;
} catch(e){}
if (CHANNELS.length > 0){
  whenYT(() => selectChannel(startIdx, { silent: true }));
} else {
  showStatus('NO SIGNAL', 'Add channels in the code to get started.', 0);
}
</script>
</body>
