<style>
  :root{
    --bg: #0B0D10;
    --panel: #15181C;
    --panel-alt: #1B1F24;
    --border: rgba(255,255,255,0.08);
    --text: #EDEAE3;
    --text-dim: #9AA0A6;
    --amber: #FFB000;
    --teal: #1B4B4F;
    --teal-bright: #2F7377;
    --live-red: #E8483C;
  }

  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background: var(--bg); color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif; overflow:hidden; }

  .display { font-family: 'Archivo Black', sans-serif; letter-spacing: 0.02em; }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  .app{
    display:grid;
    grid-template-columns: 280px 1fr;
    grid-template-rows: 64px 1fr 100px;
    grid-template-areas:
      "header header"
      "rail   screen"
      "rail   epg";
    height:100vh;
    width:100vw;
  }

  /* ---------- HEADER ---------- */
  .header{
    grid-area: header;
    display:flex; align-items:center; justify-content:space-between;
    padding: 0 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-dot{ width:10px; height:10px; border-radius:50%; background: var(--amber);
    box-shadow: 0 0 8px var(--amber); }
  .brand-text{ font-size: 18px; color: var(--text); }
  .brand-sub{ color: var(--text-dim); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; margin-left: 4px;}

  .header-right{ display:flex; align-items:center; gap:18px; }
  .ads-btn{
    background: var(--panel-alt); border: 1px solid var(--border); color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.04em;
    padding: 8px 12px; border-radius: 4px; cursor:pointer; white-space:nowrap;
  }
  .ads-btn:hover{ color: var(--text); border-color: var(--amber); }

  .clockwrap{ text-align:right; }
  .clock{ font-size: 20px; color: var(--amber); }
  .dateline{ font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; }

  /* ---------- CHANNEL RAIL ---------- */
  .rail{
    grid-area: rail;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 10px;
  }
  .channel-item{
    display:flex; align-items:center; gap:12px;
    padding: 12px 10px;
    border-radius: 6px;
    cursor: pointer;
    margin-bottom: 4px;
    border: 1px solid transparent;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .channel-item:hover{ background: var(--panel-alt); }
  .channel-item.active{
    background: var(--panel-alt);
    border-color: var(--border);
  }
  .channel-number{
    font-family: 'Archivo Black', sans-serif;
    font-size: 20px;
    width: 34px;
    color: var(--text-dim);
  }
  .channel-item.active .channel-number{ color: var(--ch-color, var(--amber)); }
  .channel-meta{ flex:1; min-width:0; }
  .channel-name{ font-size: 14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .channel-tag{
    display:inline-block; margin-top:3px;
    font-family:'IBM Plex Mono', monospace; font-size: 10px; text-transform:uppercase; letter-spacing:0.08em;
    color: var(--ch-color, var(--text-dim));
  }
  .on-air-dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--live-red);
    box-shadow: 0 0 6px var(--live-red);
    flex-shrink:0;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1;} 50%{ opacity:0.35; } }

  /* ---------- SCREEN ---------- */
  .screen-wrap{
    grid-area: screen;
    position: relative;
    background: #000;
    overflow:hidden;
  }
  #main-player, #ad-player{
    position:absolute; inset:0; width:100%; height:100%;
  }
  #ad-player{ object-fit: contain; background:#000; display:none; }

  .scanlines{
    position:absolute; inset:0; pointer-events:none;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px, transparent 1px, transparent 3px);
    mix-blend-mode: overlay;
    opacity: 0.35;
  }
  .vignette{
    position:absolute; inset:0; pointer-events:none;
    box-shadow: inset 0 0 140px 40px rgba(0,0,0,0.65);
  }

  .flicker{ animation: flicker 0.35s ease; }
  @keyframes flicker{
    0%{ filter: brightness(2.4) saturate(0.2); }
    30%{ filter: brightness(0.4); }
    60%{ filter: brightness(1.6); }
    100%{ filter: brightness(1); }
  }

  .osd{
    position:absolute; top:24px; left:24px;
    background: rgba(11,13,16,0.85);

  }

  .osd-num{ font-family:'Archivo Black', sans-serif; font-size:26px; line-height:1; color: var(--text); }

  .status-msg{

  .progress-mini{ width:220px; height:4px; background: var(--panel-alt); margin: 14px auto 0; border-radius:2px; overflow:hidden; }

  .static{

    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.05), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.04), transparent 40%);
    background-color: #111417;
  }

  /* ---------- EPG BAR ---------- */
  .epg{
    grid-area: epg;
    background: var(--panel);
    border-top: 1px solid var(--border);
    display:flex; align-items:center;
    padding: 0 24px;

  }
  .epg-block{ flex:1; min-width:0; }

  .epg-title{ font-size: 15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top: 3px; }
  .epg-bar{ height:4px; background: var(--panel-alt); border-radius:2px; margin-top:8px; overflow:hidden; }

  .epg-time{ font-family:'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-dim); margin-top:4px; }
  .epg-next{ max-width: 240px; }
  .epg-next .epg-title{ color: var(--text-dim); font-weight:500; font-size: 13px; }

  .epg.on-ad #epg-now-label{ color: var(--live-red); }
  .epg.on-ad .epg-bar-fill{ background: var(--live-red); }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 820px){
    .app{
      grid-template-columns: 1fr;
      grid-template-rows: 56px 84px 1fr 120px;
      grid-template-areas:
        "header"
        "rail"
        "screen"
        "epg";
    }
    .rail{
      display:flex; flex-direction:row; overflow-x:auto; overflow-y:hidden;

    .epg-next{ max-width:none; }

  @media (max-width: 600px){
    .ads-btn{ padding:6px 8px; font-size:9px; }
    .brand-sub{ display:none; }
    .clock{ font-size:15px; }
  }

  @media (prefers-reduced-motion: reduce){
    .flicker, .on-air-dot{ animation:none !important; }
    .osd{ transition:none; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">

<div id="probe-player" style="position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; left:-9999px;"></div>
<input type="file" id="ads-input" webkitdirectory directory multiple accept="video/mp4" style="display:none;">

<script>
/* ==================================================================
   YouTube IFrame API bootstrap
   ================================================================== */
let ytApiReady = false;
let ytApiReadyCallbacks = [];
function onYouTubeIframeAPIReady(){
  ytApiReady = true;
  ytApiReadyCallbacks.forEach(cb => cb());
  ytApiReadyCallbacks = [];
}
function whenYT(cb){ ytApiReady ? cb() : ytApiReadyCallbacks.push(cb); }

(function loadYT(){
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
})();

/* ==================================================================
   Deterministic per-day / per-slot shuffle
   ================================================================== */
function hashString(str){
  let hash = 0;
  for (let i = 0; i < str.length; i++){
    hash = (hash << 5) - hash + str.charCodeAt(i);
    hash |= 0;
  }
  return hash;
}
function mulberry32(seed){
  let a = seed;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seedStr){
  const rand = mulberry32(hashString(seedStr));
  const out = arr.slice();
  for (let i = out.length - 1; i > 0; i--){
    const j = Math.floor(rand() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}
function todayKey(){
  const d = new Date();
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}

/* ==================================================================
   Click sound effect (synthesized — no audio files needed)
   ================================================================== */
let audioCtx = null;
function getAudioCtx(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playClickSound(){
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;

    // low mechanical thunk
    const osc = ctx.createOscillator();
    const oscGain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(60, now + 0.06);
    oscGain.gain.setValueAtTime(0.25, now);
    oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
    osc.connect(oscGain).connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.09);

    // short high-frequency click transient
    const bufferSize = Math.floor(ctx.sampleRate * 0.03);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.18, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
    const filter = ctx.createBiquadFilter();
    filter.type = 'highpass'; filter.frequency.value = 2000;
    noise.connect(filter).connect(noiseGain).connect(ctx.destination);
    noise.start(now);
  } catch(e){ /* audio unavailable — fail silently */ }
}

/* ==================================================================
   Duration cache + probing (YouTube videos)
   ================================================================== */
const memDurationCache = {};
function getCachedDuration(id){
  if (memDurationCache[id] != null) return memDurationCache[id];
  try {
    const v = localStorage.getItem('signal_dur_' + id);
    return v ? parseInt(v, 10) : null;
  } catch(e){ return null; }
}
function setCachedDuration(id, seconds){
  memDurationCache[id] = seconds;
  try { localStorage.setItem('signal_dur_' + id, String(seconds)); } catch(e){}
}

let probePlayerObj = null;
function probeDuration(videoId){
  return new Promise((resolve) => {
    const cached = getCachedDuration(videoId);
    if (cached) { resolve(cached); return; }
    try {
      if (probePlayerObj) { probePlayerObj.destroy(); probePlayerObj = null; }
    } catch(e){}
    probePlayerObj = new YT.Player('probe-player', {
      height: '1', width: '1', videoId: videoId,
      playerVars: { autoplay: 0, controls: 0 },
      events: {
        onReady: (e) => {
          const dur = Math.floor(e.target.getDuration()) || 0;
          const val = dur > 0 ? dur : 180;
          setCachedDuration(videoId, val);
          try { e.target.destroy(); } catch(err){}
          resolve(val);
        },
        onError: () => {
          setCachedDuration(videoId, 180);
          try { probePlayerObj.destroy(); } catch(err){}
          resolve(180);
        }
      }
    });
  });
}
async function ensureDurations(channel, onProgress){
  const map = {};
  for (let i = 0; i < channel.videos.length; i++){
    const v = channel.videos[i];
    map[v.id] = await probeDuration(v.id);
    if (onProgress) onProgress(i + 1, channel.videos.length);
  }
  return map;
}

/* ==================================================================
   Ad clips (local .mp4 files)
   ================================================================== */
let adClips = []; // { name, file, duration }

function probeLocalDuration(file){
  return new Promise((resolve) => {
    const v = document.createElement('video');
    v.preload = 'metadata';
    v.muted = true;
    v.onloadedmetadata = () => {
      const d = isFinite(v.duration) && v.duration > 0 ? v.duration : 15;
      URL.revokeObjectURL(v.src);
      resolve(d);
    };
    v.onerror = () => resolve(15);
    v.src = URL.createObjectURL(file);
  });
}

const adsBtn = document.getElementById('ads-btn');
const adsInput = document.getElementById('ads-input');
adsBtn.addEventListener('click', () => adsInput.click());
adsInput.addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []).filter(f => /\.mp4$/i.test(f.name));
  if (files.length === 0){
    adsBtn.textContent = '🎬 No .mp4 files found';
    return;
  }
  adsBtn.textContent = '🎬 Loading ' + files.length + ' clip' + (files.length > 1 ? 's' : '') + '…';
  const loaded = [];
  for (const f of files){
    const duration = await probeLocalDuration(f);
    loaded.push({ name: f.name, file: f, duration });
  }
  adClips = loaded;
  adsBtn.textContent = '🎬 ' + adClips.length + ' ad clip' + (adClips.length > 1 ? 's' : '') + ' loaded';
  if (currentChannelIndex !== null) tuneChannel(currentChannelIndex);
});

/* Picks a deterministic (per-seed) sequence of ad clips whose total
   duration reaches roughly targetSeconds. */
function pickAdBreak(clips, seedStr, targetSeconds){
  if (!clips || clips.length === 0) return [];
  const picks = [];
  let total = 0;
  let round = 0;
  const maxClips = 12;
  while (total < targetSeconds && picks.length < maxClips && round < 20){
    const shuffled = seededShuffle(clips, seedStr + '|r' + round);
    for (const clip of shuffled){
      picks.push(clip);
      total += clip.duration || 15;
      if (total >= targetSeconds || picks.length >= maxClips) break;
    }
    round++;
  }
  return picks;
}

/* ==================================================================
   Schedule — a flat list of items (videos + ad-break clips) with
   known durations, walked using real elapsed time in the day.
   ================================================================== */
function buildSchedule(channel, durationsById, clips){
  const order = seededShuffle(channel.videos, todayKey() + '|' + channel.id);
  const items = [];
  order.forEach((v, i) => {
    items.push({ type: 'video', video: v, duration: durationsById[v.id] || 180 });
    const isBreakSlot = (i % AD_BREAK_FREQUENCY) === (AD_BREAK_FREQUENCY - 1);
    if (AD_BREAKS_ENABLED && isBreakSlot && clips && clips.length > 0){
      const breakSeed = todayKey() + '|' + channel.id + '|break' + i;
      const breakClips = pickAdBreak(clips, breakSeed, AD_BREAK_SECONDS);
      breakClips.forEach((c, ci) => {
        items.push({ type: 'ad', clip: c, duration: c.duration || 15, breakIndex: i, clipIndex: ci, breakTotal: breakClips.length });
      });
    }
  });
  const durations = items.map(it => it.duration);
  const total = durations.reduce((a, b) => a + b, 0);
  return { items, durations, total };
}

function getNowPlaying(schedule){
  const now = new Date();
  const secs = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds() + now.getMilliseconds() / 1000;
  const elapsed = schedule.total > 0 ? (secs % schedule.total) : 0;
  let acc = 0;
  for (let i = 0; i < schedule.items.length; i++){
    const d = schedule.durations[i];
    if (elapsed < acc + d){
      return {
        index: i, item: schedule.items[i], offset: elapsed - acc, duration: d,
        nextItem: schedule.items[(i + 1) % schedule.items.length]
      };
    }
    acc += d;
  }
  const li = schedule.items.length - 1;
  return { index: li, item: schedule.items[li], offset: 0, duration: schedule.durations[li] || 0, nextItem: schedule.items[0] };
}
function itemTitle(item){
  if (!item) return '—';
  if (item.type === 'ad') return 'Commercial: ' + item.clip.name.replace(/\.[^.]+$/, '');
  return item.video.title;
}
function fmtTime(s){
  s = Math.max(0, Math.floor(s));
  const m = Math.floor(s / 60), sec = s % 60;
  return m + ":" + String(sec).padStart(2, '0');
}

/* ==================================================================
   App state / UI wiring
   ================================================================== */
let currentChannelIndex = null;
let currentSchedule = null;
let mainPlayer = null;
let mainPlayerReady = false;
let loadedAdKey = null;
let currentAdObjectUrl = null;

const railEl = document.getElementById('rail');
const clockEl = document.getElementById('clock');
const datelineEl = document.getElementById('dateline');
const statusMsg = document.getElementById('status-msg');
const statusBig = document.getElementById('status-big');
const statusSub = document.getElementById('status-sub');
const statusProgress = document.getElementById('status-progress');
const screenWrap = document.getElementById('screen-wrap');
const staticBg = document.getElementById('static-bg');
const osd = document.getElementById('osd');
const osdNum = document.getElementById('osd-num');
const osdName = document.getElementById('osd-name');
const epgEl = document.getElementById('epg');
const epgNowLabel = document.getElementById('epg-now-label');
const epgNowTitle = document.getElementById('epg-now-title');
const epgNowBar = document.getElementById('epg-now-bar');
const epgNowTime = document.getElementById('epg-now-time');
const epgNextTitle = document.getElementById('epg-next-title');
const mainPlayerEl = document.getElementById('main-player');
const adPlayerEl = document.getElementById('ad-player');

function renderRail(){
  railEl.innerHTML = '';
  CHANNELS.forEach((ch, idx) => {
    const item = document.createElement('div');
    item.className = 'channel-item' + (idx === currentChannelIndex ? ' active' : '');
    item.style.setProperty('--ch-color', ch.color);
    item.onclick = () => selectChannel(idx);
    item.innerHTML = `
      <div class="channel-number mono">${ch.number}</div>
      <div class="channel-meta">
        <div class="channel-name">${ch.name}</div>
        <div class="channel-tag">${ch.category}</div>
      </div>
      ${idx === currentChannelIndex ? '<div class="on-air-dot"></div>' : ''}
    `;
    railEl.appendChild(item);
  });
}

function showStatus(big, sub, progress){
  statusMsg.style.display = 'flex';
  statusBig.textContent = big;
  statusSub.textContent = sub || '';
  statusProgress.style.width = (progress || 0) + '%';
  staticBg.style.display = 'block';
}
function hideStatus(){
  statusMsg.style.display = 'none';
  staticBg.style.display = 'none';
}

function showOSD(ch){
  osd.style.setProperty('--osd-color', ch.color);
  osdNum.textContent = ch.number;
  osdName.textContent = ch.name + ' — ' + ch.category;
  osd.classList.add('show');
  clearTimeout(showOSD._t);
  showOSD._t = setTimeout(() => osd.classList.remove('show'), 2500);
}

function flickerScreen(){
  screenWrap.classList.remove('flicker');
  void screenWrap.offsetWidth; // restart animation
  screenWrap.classList.add('flicker');
}

async function selectChannel(idx, opts){
  opts = opts || {};
  if (idx === currentChannelIndex) return;
  currentChannelIndex = idx;
  try { localStorage.setItem('signal_last_channel', String(idx)); } catch(e){}
  renderRail();
  const ch = CHANNELS[idx];
  showOSD(ch);
  flickerScreen();
  if (!opts.silent) playClickSound();
  await tuneChannel(idx);
}

async function tuneChannel(idx){
  const ch = CHANNELS[idx];
  if (!ch.videos || ch.videos.length === 0){
    currentSchedule = null;
    showStatus('NO SIGNAL', 'This channel has no videos yet — add some in the code.', 0);
    return;
  }
  showStatus('TUNING IN…', ch.name, 0);
  whenYT(async () => {
    const durationsById = await ensureDurations(ch, (done, totalCount) => {
      showStatus('TUNING IN…', ch.name + ' — analyzing ' + done + '/' + totalCount, (done / totalCount) * 100);
    });
    if (idx !== currentChannelIndex) return; // user switched away while loading
    currentSchedule = buildSchedule(ch, durationsById, adClips);
    hideStatus();
    const np = getNowPlaying(currentSchedule);
    showItem(np);
    updateEPG(np);
  });
}

function itemKey(item){
  if (!item) return null;
  return item.type === 'ad'
    ? ('ad:' + item.clip.name + ':' + item.breakIndex + ':' + item.clipIndex)
    : ('video:' + item.video.id);
}

function loadIntoYouTube(np){
  whenYT(() => {
    const vid = np.item.video.id;
    if (!mainPlayer){
      mainPlayer = new YT.Player('main-player', {
        height: '100%', width: '100%', videoId: vid,
        playerVars: { autoplay: 1, controls: 1, rel: 0, modestbranding: 1 },
        events: {
          onReady: (e) => {
            mainPlayerReady = true;
            e.target.seekTo(np.offset, true);
            e.target.playVideo();
          },
          onError: () => { /* bad video id — schedule will move on next tick */ }
        }
      });
      mainPlayer._loadedId = vid;
    } else if (mainPlayer._loadedId !== vid){
      mainPlayer.loadVideoById(vid, np.offset);
      mainPlayer._loadedId = vid;
    } else if (mainPlayerReady && typeof mainPlayer.getPlayerState === 'function'){
      const state = mainPlayer.getPlayerState();
      if (state !== 1 /* YT.PlayerState.PLAYING */){
        mainPlayer.seekTo(np.offset, true);
        mainPlayer.playVideo();
      }
    }
  });
}

function showItem(np){
  if (np.item.type === 'video'){
    adPlayerEl.pause();
    adPlayerEl.style.display = 'none';
    mainPlayerEl.style.display = 'block';
    loadIntoYouTube(np);
  } else {
    mainPlayerEl.style.display = 'none';
    try { if (mainPlayer && mainPlayer.pauseVideo) mainPlayer.pauseVideo(); } catch(e){}
    adPlayerEl.style.display = 'block';
    const key = itemKey(np.item);
    if (loadedAdKey !== key){
      if (currentAdObjectUrl) URL.revokeObjectURL(currentAdObjectUrl);
      currentAdObjectUrl = URL.createObjectURL(np.item.clip.file);
      adPlayerEl.src = currentAdObjectUrl;
      loadedAdKey = key;
      adPlayerEl.currentTime = 0;
      adPlayerEl.play().catch(() => {});
    } else if (Math.abs(adPlayerEl.currentTime - np.offset) > 2){
      adPlayerEl.currentTime = np.offset;
    }
    if (adPlayerEl.paused) adPlayerEl.play().catch(() => {});
  }
}

function updateEPG(np){
  const isAd = np.item.type === 'ad';
  epgEl.classList.toggle('on-ad', isAd);
  epgNowLabel.textContent = isAd ? 'Ad Break' : 'Now';
  epgNowTitle.textContent = itemTitle(np.item);
  epgNowBar.style.width = np.duration > 0 ? ((np.offset / np.duration) * 100) + '%' : '0%';
  epgNowTime.textContent = fmtTime(np.offset) + ' / ' + fmtTime(np.duration);
  epgNextTitle.textContent = np.nextItem
    ? (np.nextItem.type === 'ad' ? 'Commercial Break' : np.nextItem.video.title)
    : '—';
}

/* Main sync loop: recomputes what should be on air every second and
   corrects for drift, swapping between YouTube video and local ad clip
   as needed. */
setInterval(() => {
  if (!currentSchedule) return;
  const np = getNowPlaying(currentSchedule);
  updateEPG(np);
  showItem(np);
  if (np.item.type === 'video' && mainPlayer && mainPlayerReady && mainPlayer._loadedId === np.item.video.id
      && typeof mainPlayer.getCurrentTime === 'function'){
    const cur = mainPlayer.getCurrentTime();
    if (Math.abs(cur - np.offset) > 4) mainPlayer.seekTo(np.offset, true);
  }
}, 1000);

/* Clock */
setInterval(() => {
  const now = new Date();
  clockEl.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  datelineEl.textContent = now.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
}, 1000);

/* Keyboard remote: up/down arrows change channel */
window.addEventListener('keydown', (e) => {
  if (CHANNELS.length === 0) return;
  if (e.key === 'ArrowUp'){
    const next = currentChannelIndex === null ? 0 : (currentChannelIndex - 1 + CHANNELS.length) % CHANNELS.length;
    selectChannel(next);
  } else if (e.key === 'ArrowDown'){
    const next = currentChannelIndex === null ? 0 : (currentChannelIndex + 1) % CHANNELS.length;
    selectChannel(next);
  }
});

/* Accept either a bare 11-character video ID or a full YouTube URL
   (youtu.be/…, watch?v=…, embed/…, shorts/…) in CHANNELS so you don't
   have to hand-trim links. */
function extractYouTubeId(input){
  if (!input) return input;
  const trimmed = String(input).trim();
  if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;
  const patterns = [
    /youtu\.be\/([a-zA-Z0-9_-]{11})/,
    /[?&]v=([a-zA-Z0-9_-]{11})/,
    /embed\/([a-zA-Z0-9_-]{11})/,
    /shorts\/([a-zA-Z0-9_-]{11})/
  ];
  for (const re of patterns){
    const m = trimmed.match(re);
    if (m) return m[1];
  }
  return trimmed; // not recognized — leave as-is, will just fail to load
}
CHANNELS.forEach(ch => (ch.videos || []).forEach(v => { v.id = extractYouTubeId(v.id); }));

/* Boot */
renderRail();
let startIdx = 0;
try {
  const saved = parseInt(localStorage.getItem('signal_last_channel'), 10);
  if (!isNaN(saved) && saved >= 0 && saved < CHANNELS.length) startIdx = saved;
} catch(e){}
if (CHANNELS.length > 0){
  whenYT(() => selectChannel(startIdx, { silent: true }));
} else {
  showStatus('NO SIGNAL', 'Add channels in the code to get started.', 0);
}
</script>
</body>
